name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno task install:all

      - name: Check (type check, lint, fmt)
        run: deno task check:all

      - name: Unit & e2e tests
        run: deno task test:all

      - name: Build both packages
        run: deno task build:all

      - name: Install Playwright Chromium
        working-directory: packages/browser-evm-signer
        run: deno task playwright:install

      - name: Browser tests
        working-directory: packages/browser-evm-signer
        run: deno task test:browser
