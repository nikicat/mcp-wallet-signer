name: Publish package

# Tag a release as `<package>@<version>`, e.g. `mcp-wallet-signer@0.7.0`, matching the version
# in that package's package.json.
on:
  release:
    types: [created]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm auth is trusted publishing (OIDC) — no tokens in this repo. Each package lists this
      # repo + publish.yml as its trusted publisher on npmjs.com, and npm generates provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm test # also builds dist/, which the library packages publish

      - name: Publish ${{ github.event.release.tag_name }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PACKAGE="${TAG%@*}"
          VERSION="${TAG#*@}"
          if [ ! -d "packages/$PACKAGE" ]; then
            echo "::error::Unknown package '$PACKAGE' in tag '$TAG'"
            exit 1
          fi
          LOCAL=$(node -p "require('./packages/$PACKAGE/package.json').version")
          if [ "$LOCAL" != "$VERSION" ]; then
            echo "::error::$PACKAGE is at $LOCAL, but the tag says $VERSION"
            exit 1
          fi
          npm publish --provenance --access public --workspace "packages/$PACKAGE"
